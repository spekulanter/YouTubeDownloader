[package]
name = "streamforge"
version = "0.1.4"
description = "Modern Windows GUI for yt-dlp"
authors = ["StreamForge contributors"]
edition = "2021"

[lib]
name = "streamforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["io-util", "process", "sync", "rt", "macros"] }
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
